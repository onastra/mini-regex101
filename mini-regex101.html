<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Regex101</title>
  <script src="https://cdn.tailwindcss.com/"></script>
</head>
<style>
  input,button {
    outline: none;
  }
  /* #result em:nth-of-type(odd){
    font-weight: normal;
    background-color: #9fcfff;
  }
  #result em:nth-of-type(even){
    font-weight: normal;
    background-color: #d5ebff;
  } */
  #output {
    position: relative;
    width: 300px;
    height: 200px;
    > textarea, #result {
      font-family: consolas;
      white-space: pre-wrap;
      word-break: break-all;
      /* position: absolute; */
      width: 100%;
      height: 100%;
      border: 1px solid;
      overflow: auto;
      background-color: transparent;

    }
  }
  em {
    font-style: normal;
  }
  em:not(:has(:hover)):hover {
    outline: 2px solid grey;
  }
  em:not(:has(:hover)):hover em {
    background-color: inherit;
  }
  /* #result > em:nth-of-type(odd){

  }
  #result > em:nth-of-type(even){

  } */
  [data-group-index="0"]:nth-of-type(odd){
    font-weight: normal;
    background-color: #9fcfff;
  }
  [data-group-index="0"]:nth-of-type(even){
    font-weight: normal;
    background-color: #d5ebff;
  }
  [data-group-index="1"] {
    background-color: #9fcba1;
  }
  [data-group-index="2"] {
    background-color: #e0bf8b;
  }
  [data-group-index="3"] {
    background-color: #acadfc;
  }
  [data-group-index="4"] {
    background-color: #e1abf5;
  }
  .zero-width-assert {
    border-left: 2px dotted rgb(0, 119, 255);
    opacity: 1 !important;
    margin-left: -1px;
    margin-right: -1px;
  }
</style>
<body>
  <div>
    <div>REGULAR EXPRESSION</div>
    <input class="border" type="text" id="regexInput" onkeyup="run()" value="(.(.)(.))(..)">
    <button class="border" onclick="run()">RUN</button>
    <div id="tips"></div>
    <div>FLAGS</div>
    <label><input type="checkbox" id="flag-g" checked>g</label>
    <label><input type="checkbox" id="flag-m">m</label>
    <label><input type="checkbox" id="flag-i">i</label>
    <label><input type="checkbox" id="flag-y">y</label>
    <label><input type="checkbox" id="flag-u">u</label>
    <label><input type="checkbox" id="flag-s">s</label>
    <label><input type="checkbox" id="flag-d" checked>d</label>
    <label><input type="checkbox" id="flag-v">v</label>
    
    <div>TEST STRING</div>
    <div id="output">
      <div id="result" onscroll="syncScroll2()"></div>
      <textarea class="border" id="testStringInput" oninput="run()" onscroll="syncScroll1()">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Deserunt, quae.
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Natus, rem!
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. At, facere!
      </textarea>
    </div>
  </div>
  <script>
    // 元素的id为xxx时，页面的全局就会出现一个叫xxx的变量，指向一个表示那个标签的对象

    function run(){
      var regexString = regexInput.value // 可以通过value属性读取到文本框的值
      if(regexString == ""){
        return
      }
      var flags = getFlags()
      try {
        var regex = new RegExp(regexString,flags)
        tips.innerHTML = "" // 成功则清空报错信息
      } catch (error) {
        if(error instanceof SyntaxError){
          tips.innerHTML = error.message // 显示错误信息
          return
        }else{
          throw error
        }
      }
      
      var testString = testStringInput.value

      var html = ""
      var match
      var pos = 0
      var matchIndex = 0
      while(match = regex.exec(testString)){
        html += testString.slice(pos,match.index)
        html += highlightMatch(match,matchIndex)
        pos = regex.lastIndex
        if(match[0].length == 0){
          regex.lastIndex++
        }
        if(regex.global == false) {
          break
        }
        matchIndex++
      }
      html += testString.slice(pos)
      result.innerHTML = html // 这里用的不是value属性，而是innerHTML属性，因为它不是文本框
    }

    function getFlags(){
      var flags = ["g","m","i","y","u","s","d","v"]
      return flags.filter(it => {
        var element = document.getElementById("flag-" + it)
        if(element.checked){ // 对于checkbox来说，checked属性可以返回它是否有被打上勾
          return true
        } else {
          return false
        }
      }).join("")
    }

    function syncScroll1(){
      result.scrollTop = testStringInput.scrollTop // 同步文本框和div的滚动位置
    }
  
    function syncScroll2(){
      testStringInput.scrollTop = result.scrollTop
    }

    function highlightMatch(match,matchIndex){
      if(match[0].length == 0){
        var info = [
          `Match: ${matchIndex + 1}`,
          `-----`,
          `Group 0: [empty string]`,
          `Pos: ${match.index}-${match.index}`
        ].join("\n")
        return `<em class="zero-width-assert" title = "${info}"></em>`
      }

      var helper = new Array(match[0].length+1).fill("")

      var groupIndex = 0
      for(var index of match.indices){
        var start = index[0] - match.index
        var end = index[1] - match.index
        var info = `
          Match ${matchIndex + 1}
          -----
          Group ${groupIndex}
          Pos: ${index[0]}-${index[1]}
        `
        helper[start] += `<em data-group-index="${groupIndex}" title="${info}">`
        helper[end] = `</em>` + helper[end]
        groupIndex++
      }

      var result = ``
      for (var i = 0;i < match[0].length;i++){
        result += helper[i] + match[0][i]
      }
      result += helper[i]
      return result
    }
  </script>
  
</body>
</html>
